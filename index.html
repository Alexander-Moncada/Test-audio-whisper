<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voz a Texto | Whisper Large V3</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #2e90fa 0%, transparent 35%),
        linear-gradient(135deg, #0b1220, #111827, #1f2937);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 32px;
      padding: 40px 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 12px auto 28px;
      color: #d0d5dd;
      max-width: 520px;
      line-height: 1.5;
    }

    .model-pill {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(46, 144, 250, 0.18);
      border: 1px solid rgba(46, 144, 250, 0.45);
      color: #d1e9ff;
      font-weight: bold;
      margin-bottom: 34px;
    }

    .record-wrapper {
      display: flex;
      justify-content: center;
      margin: 28px 0;
    }

    .record-button {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(145deg, #f04438, #d92d20);
      color: white;
      font-size: 54px;
      box-shadow:
        0 0 0 0 rgba(240, 68, 56, 0.45),
        0 24px 60px rgba(240, 68, 56, 0.35);
      transition: 0.18s ease;
      user-select: none;
      touch-action: none;
    }

    .record-button:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .record-button.recording {
      transform: scale(0.94);
      background: linear-gradient(145deg, #12b76a, #039855);
      box-shadow:
        0 0 0 18px rgba(18, 183, 106, 0.12),
        0 0 0 34px rgba(18, 183, 106, 0.06),
        0 24px 60px rgba(18, 183, 106, 0.35);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow:
          0 0 0 0 rgba(18, 183, 106, 0.28),
          0 24px 60px rgba(18, 183, 106, 0.35);
      }
      70% {
        box-shadow:
          0 0 0 32px rgba(18, 183, 106, 0),
          0 24px 60px rgba(18, 183, 106, 0.35);
      }
      100% {
        box-shadow:
          0 0 0 0 rgba(18, 183, 106, 0),
          0 24px 60px rgba(18, 183, 106, 0.35);
      }
    }

    .hint {
      color: #eaecf0;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .status {
      margin: 18px auto 22px;
      padding: 14px 18px;
      max-width: 520px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      color: #eaecf0;
    }

    audio {
      width: 100%;
      max-width: 560px;
      margin: 10px 0 24px;
    }

    .result-box {
      text-align: left;
      max-width: 620px;
      margin: 0 auto;
      background: #ffffff;
      color: #101828;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
    }

    .result-title {
      font-weight: bold;
      color: #344054;
      margin-bottom: 10px;
    }

    #resultado {
      font-size: 20px;
      line-height: 1.55;
      min-height: 70px;
      white-space: pre-wrap;
    }

    .footer {
      margin-top: 18px;
      color: #98a2b3;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="card">
      <h1>Voz a Texto</h1>

      <p class="subtitle">
        Mantén presionado el botón para grabar. Al soltarlo, el audio se enviará al modelo de transcripción.
      </p>

      <div class="model-pill">
        Modelo: whisper-large-v3
      </div>

      <div class="record-wrapper">
        <button id="btnGrabar" class="record-button" title="Mantén presionado para grabar">
          🎙️
        </button>
      </div>

      <div class="hint">
        Mantén presionado para hablar, suelta para transcribir.
      </div>

      <div id="estado" class="status">
        Estado: listo para grabar.
      </div>

      <audio id="audioPreview" controls></audio>

      <div class="result-box">
        <div class="result-title">Texto transcrito:</div>
        <div id="resultado">Aquí aparecerá la transcripción...</div>
      </div>

      <div class="footer">
        Groq + Whisper Large V3
      </div>
    </section>
  </main>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let streamActual;
    let grabando = false;

    const btnGrabar = document.getElementById("btnGrabar");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");
    const audioPreview = document.getElementById("audioPreview");

    const BACKEND_URL = "http://localhost:5000/transcribir";

    async function iniciarGrabacion() {
      if (grabando) return;

      try {
        streamActual = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioChunks = [];

        const opciones = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
          ? { mimeType: "audio/webm;codecs=opus" }
          : { mimeType: "audio/webm" };

        mediaRecorder = new MediaRecorder(streamActual, opciones);

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
          const audioUrl = URL.createObjectURL(audioBlob);

          audioPreview.src = audioUrl;

          detenerMicrofono();

          estado.textContent = "Estado: enviando audio a Whisper Large V3...";
          resultado.textContent = "Transcribiendo...";

          await enviarAudio(audioBlob);
        };

        mediaRecorder.start();

        grabando = true;
        btnGrabar.classList.add("recording");
        estado.textContent = "Estado: grabando... suelta el botón para detener.";

      } catch (error) {
        estado.textContent = "Error: no se pudo acceder al micrófono.";
        console.error(error);
      }
    }

    function detenerGrabacion() {
      if (!grabando) return;

      grabando = false;
      btnGrabar.classList.remove("recording");

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }

      estado.textContent = "Estado: procesando grabación...";
    }

    function detenerMicrofono() {
      if (streamActual) {
        streamActual.getTracks().forEach(track => track.stop());
      }
    }

    async function enviarAudio(audioBlob) {
      const formData = new FormData();

      formData.append("audio", audioBlob, "grabacion.webm");
      formData.append("modelo", "whisper-large-v3");

      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Error desconocido");
        }

        resultado.textContent = data.texto;
        estado.textContent = "Estado: transcripción completada.";

      } catch (error) {
        resultado.textContent = "Error al transcribir el audio.";
        estado.textContent = "Estado: error en la transcripción.";
        console.error(error);
      }
    }

    btnGrabar.addEventListener("pointerdown", iniciarGrabacion);
    btnGrabar.addEventListener("pointerup", detenerGrabacion);
    btnGrabar.addEventListener("pointerleave", detenerGrabacion);
    btnGrabar.addEventListener("pointercancel", detenerGrabacion);
  </script>
</body>
</html>
